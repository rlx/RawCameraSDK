name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift package and demo
    # GitHub's Xcode 27 image, the toolchain the project is developed with. It is a preview
    # image; move to the macOS label that carries Xcode 27 once one is generally available.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # LibRaw

      # The sample RAW files are 285 MB from a volunteer-run archive; fetch them once per
      # manifest revision, not once per run.
      - name: Restore sample files
        uses: actions/cache@v4
        with:
          path: Examples/RawInputDemo/Samples/files
          key: samples-${{ hashFiles('Examples/RawInputDemo/Samples/manifest.json') }}

      - name: Fetch sample files
        run: Examples/RawInputDemo/Scripts/fetch-samples.sh

      - name: Build
        run: swift build

      # Suites that need a GPU or a file that is not present skip themselves and say so.
      - name: Test
        run: swift test

      - name: Build the demo app for iOS
        run: |
          xcodebuild build \
            -project Examples/RawInputDemo/RawInputDemo.xcodeproj -scheme RawInputDemo \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet

      # The Rust crate with its WGSL kernel, on the same machine so it has a GPU to run on.
      - name: Rust crate
        working-directory: Bindings/rust
        run: cargo test --features gpu

  portable:
    name: Portable core on Linux, and WebAssembly
    # Not a Mac on purpose: the core claims to need nothing from Apple, and this is the check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore sample files
        uses: actions/cache@v4
        with:
          path: Examples/RawInputDemo/Samples/files
          key: samples-${{ hashFiles('Examples/RawInputDemo/Samples/manifest.json') }}
          enableCrossOsArchive: true

      - name: Fetch sample files
        run: Examples/RawInputDemo/Scripts/fetch-samples.sh

      - name: Core, built with CMake and run from C
        run: |
          cmake -S . -B .build/cmake
          cmake --build .build/cmake -j 4
          ctest --test-dir .build/cmake --output-on-failure

      # The decoder only: a hosted Linux runner has no GPU for the WGSL kernel.
      - name: Rust crate
        working-directory: Bindings/rust
        run: cargo test

      - uses: mymindstorm/setup-emsdk@v14

      - name: WebAssembly build, run under Node
        run: |
          emcmake cmake -S . -B .build/wasm
          cmake --build .build/wasm -j 4
          node Bindings/web/test.mjs
