name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # GitHub's Xcode 27 image, the toolchain the project is developed with. It is a preview
    # image; move to the macOS label that carries Xcode 27 once one is generally available.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # LibRaw

      # The sample RAW files are 285 MB from a volunteer-run archive; fetch them once per
      # manifest revision, not once per run.
      - name: Restore sample files
        uses: actions/cache@v4
        with:
          path: Examples/RawInputDemo/Samples/files
          key: samples-${{ hashFiles('Examples/RawInputDemo/Samples/manifest.json') }}

      - name: Fetch sample files
        run: Examples/RawInputDemo/Scripts/fetch-samples.sh

      - name: Build
        run: swift build

      # Suites that need a GPU or a file that is not present skip themselves and say so.
      - name: Test
        run: swift test

      - name: Build the demo app for iOS
        run: |
          xcodebuild build \
            -project Examples/RawInputDemo/RawInputDemo.xcodeproj -scheme RawInputDemo \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
