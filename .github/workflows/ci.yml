name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift package and demo
    # GitHub's Xcode 27 preview image. Move to the macOS label that carries Xcode 27 once
    # one is generally available.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # LibRaw

      # The sample RAW files are 285 MB. Fetch them once per manifest revision.
      - name: Restore sample files
        uses: actions/cache@v4
        with:
          path: Examples/RawInputDemo/Samples/files
          key: samples-${{ hashFiles('Examples/RawInputDemo/Samples/manifest.json') }}

      - name: Fetch sample files
        run: Examples/RawInputDemo/Scripts/fetch-samples.sh

      - name: Build
        run: swift build

      # Suites that need a GPU or a file that is not present skip themselves and say so.
      - name: Test
        run: swift test

      # Damaged copies of the sample files, each decoded in a child process, under
      # AddressSanitizer. A crash or a hang fails the step. The seed changes with every run,
      # and a failing case is kept as an artifact so it can be replayed.
      - name: Fuzz the fallback
        run: |
          swift build -c release --sanitize=address --scratch-path .build/asan
          .build/asan/release/rawprobe fuzz Examples/RawInputDemo/Samples/files/* \
            --iterations 60 --seed ${{ github.run_number }}

      - name: Keep fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-findings/
          if-no-files-found: ignore

      - name: Build the demo app for iOS
        run: |
          xcodebuild build \
            -project Examples/RawInputDemo/RawInputDemo.xcodeproj -scheme RawInputDemo \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet

      # The Rust crate with its WGSL kernel, here because this machine has a GPU.
      - name: Rust crate
        working-directory: Bindings/rust
        run: cargo test --features gpu

  portable:
    name: Portable core on Linux, and WebAssembly
    # Linux, to check that the core needs nothing from Apple.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore sample files
        uses: actions/cache@v4
        with:
          path: Examples/RawInputDemo/Samples/files
          key: samples-${{ hashFiles('Examples/RawInputDemo/Samples/manifest.json') }}
          enableCrossOsArchive: true

      - name: Fetch sample files
        run: Examples/RawInputDemo/Scripts/fetch-samples.sh

      - name: Core, built with CMake and run from C
        run: |
          cmake -S . -B .build/cmake
          cmake --build .build/cmake -j 4
          ctest --test-dir .build/cmake --output-on-failure

      # The decoder only. A hosted Linux runner has no GPU for the WGSL kernel.
      - name: Rust crate
        working-directory: Bindings/rust
        run: cargo test

      - uses: mymindstorm/setup-emsdk@v14

      - name: WebAssembly build, run under Node
        run: |
          emcmake cmake -S . -B .build/wasm
          cmake --build .build/wasm -j 4
          node Bindings/web/test.mjs
